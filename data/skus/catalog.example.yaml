# SKU 知识卡片示例 —— 按此模板扩充至莱克/碧云泉/咖博士全量在售 SKU
# 字段说明:
#   id: 唯一标识; name: 商品名; category: 品类; price_note: 价格说明(不写死价格, 以电商后台为准)
#   specs: 规格参数(键值对); selling_points: 核心卖点(口语化, 直播/客服可直接用)
#   scenarios: 适用场景; faq: 常见问题(问答对, 直接影响问答准确率, 必填>=3条)
#   after_sales: 售后政策; confusion: 易混淆点(与其他型号/竞品的区别, 必填>=1条)
skus:
  - id: BYQ-C5PLUS
    name: 碧云泉 C5 Plus 净水器
    category: 净饮水
    price_note: 以电商后台实时价为准
    specs:
      水箱容量: 4L
      过滤: RO反渗透+矿化
      加热: 即热式, 多档调温
      安装: 免安装, 台式
    selling_points:
      - 台式免安装, 客厅卧室随手放
      - RO反渗透+矿化, 出水可直接饮用
      - 即热多档温控, 冲蜂蜜/泡茶/冲奶一步到位
    scenarios:
      - 家庭日常饮水
      - 有孩家庭冲奶
      - 办公室茶水间
    faq:
      - q: 滤芯多久换一次?
        a: 滤芯为多级复合设计, 建议按机器寿命提醒更换; 具体周期以当地水质和说明书为准, 机身会有更换提示。
      - q: 这款需要接水管吗?
        a: 不需要。C5 Plus 是台式免安装设计, 水箱手动加水即可, 适合不便于改水路的场景。
      - q: 出热水快吗? 最高多少度?
        a: 即热式加热, 无需等待; 支持多档调温, 具体档位与最高温度以产品说明为准。
    after_sales:
      保修: 国家三包范围, 以官方售后政策为准
      耗材: 滤芯等耗材可在官方旗舰店采购
    confusion:
      - 与 C5 基础版的区别: Plus 版在调温档位与水箱设计上有升级, 销售时以当前在售页面配置表为准, 不要凭记忆报价。

  - id: LEXY-LUCY
    name: LUCY 立式吸尘器
    category: 家用清洁电器
    price_note: 以电商后台实时价为准
    specs:
      形态: 立式手持两用
      适用: 地板/地毯/沙发/车用
    selling_points:
      - 立式随手立停, 大扫除中途随时中断
      - 轻量化主机, 举高清洁不费力
      - 一键倒尘不脏手
    scenarios:
      - 全屋日常除尘
      - 有宠物家庭
      - 车内清洁
    faq:
      - q: 能吸地毯吗?
        a: 可以, 地板/地毯均可; 地毯深层脏污建议配合专用吸头并多次往复。
      - q: 续航多久?
        a: 续航随吸头档位变化, 标准档可满足日常全屋清扫, 具体以说明书为准。
      - q: 尘杯怎么清洗?
        a: 一键倒尘后可拆洗尘杯, 建议晾干后装回, 禁止水洗电机部位。
    after_sales:
      保修: 国家三包范围, 以官方售后政策为准
    confusion:
      - 与卧式吸尘器区别: 立式形态随停随立, 更适合间断式清扫场景。

  - id: DR-COFFEE
    name: 咖博士 Dr.coffee 咖啡机
    category: 咖啡电器
    price_note: 以电商后台实时价为准
    specs:
      类型: 全自动/半自动(按具体型号)
      适用: 意式浓缩/美式/奶咖
    selling_points:
      - 一键出杯, 家用做出咖啡馆水准
      - 可调研磨粗细与萃取参数
      - 与碧云泉净水器组合, 水质口感双升级
    scenarios:
      - 家庭咖啡角
      - 周末冰美式自由
      - 小型办公茶水间
    faq:
      - q: 必须用净水吗?
        a: 建议使用过滤水/纯净水, 可减少水垢延长机器寿命; 搭配碧云泉净水器出水更稳定。
      - q: 可以打奶泡吗?
        a: 视具体型号配置, 带蒸汽棒或自动奶泡系统的型号支持, 购买页有明确标注。
      - q: 日常怎么保养?
        a: 每次使用后清洁冲煮头/蒸汽棒, 定期除垢; 详细步骤见说明书保养章节。
    after_sales:
      保修: 国家三包范围, 以官方售后政策为准
    confusion:
      - 型号众多: 不同型号在奶泡系统/研磨器上有差异, 介绍时必须锚定当前在售型号页面。
